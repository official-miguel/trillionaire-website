<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Laptop icon with code brackets -->
  <g transform="translate(600, 200)">
    <!-- Laptop screen -->
    <rect x="-120" y="-60" width="240" height="140" rx="8" fill="none" stroke="#32cd32" stroke-width="3"/>
    
    <!-- Code brackets inside screen -->
    <path d="M -60 0 L -80 20 L -60 40" stroke="#32cd32" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 0 L 80 20 L 60 40" stroke="#32cd32" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="20" y1="5" x2="-20" y2="35" stroke="#32cd32" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Laptop base -->
    <path d="M -140 80 L -120 80 L -120 75 L 120 75 L 120 80 L 140 80 L 130 95 L -130 95 Z" fill="#32cd32"/>
  </g>
  
  <!-- Company name -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff" text-anchor="middle">
    Trillionaire Designs
  </text>
  
  <!-- Tagline 1 -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#32cd32" text-anchor="middle">
    Software. Systems. AI.
  </text>
  
  <!-- Tagline 2 -->
  <text x="600" y="495" font-family="Arial, sans-serif" font-size="28" font-weight="300" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">
    Design. Develop. Innovate.
  </text>
  
  <!-- Website URL -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">
    trillionairedesigns.co.ke
  </text>
</svg>